<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#ffffff"/>
  <rect width="800" height="70" fill="#0F3D3E"/>
  <text x="400" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="white">الخوارزميات - مقدمة</text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Algorithms - Introduction</text>

  <rect x="40" y="90" width="720" height="2" fill="#E8985E"/>

  <text x="400" y="140" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#0F3D3E">تعريف الخوارزمية</text>
  <text x="400" y="175" text-anchor="middle" font-family="Arial" font-size="15" fill="#4a5568">مجموعة من التعليمات المنطقية المرتبة لحل مشكلة معينة</text>

  <rect x="60" y="200" width="680" height="120" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="235" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#065f46">أنواع الخوارزميات الرئيسية</text>
  <text x="130" y="270" font-family="Arial" font-size="14" fill="#1a1a2e">◆ خوارزميات الفرز (Sorting Algorithms)</text>
  <text x="130" y="295" font-family="Arial" font-size="14" fill="#1a1a2e">◆ خوارزميات البحث (Search Algorithms)</text>
  <text x="130" y="318" font-family="Arial" font-size="14" fill="#1a1a2e">◆ خوارزميات التشفير (Encryption Algorithms)</text>

  <rect x="60" y="340" width="320" height="120" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="220" y="370" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#0369a1">التعقيد الزمني</text>
  <text x="220" y="400" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#0F3D3E">O(n²)</text>
  <text x="220" y="430" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">الفرز الفقاعي - أسوأ حالة</text>
  <text x="220" y="450" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Bubble Sort - Worst Case</text>

  <rect x="420" y="340" width="320" height="120" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="580" y="370" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#713f12">التعقيد الزمني</text>
  <text x="580" y="400" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#0F3D3E">O(n log n)</text>
  <text x="580" y="430" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">الفرز السريع - متوسط</text>
  <text x="580" y="450" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">Quick Sort - Average</text>

  <rect x="0" y="480" width="800" height="20" fill="#0F3D3E"/>
  <text x="400" y="494" text-anchor="middle" font-family="Arial" font-size="11" fill="rgba(255,255,255,0.6)">إشارة - Isharah | Eduthon 3 - KKU</text>
</svg>
