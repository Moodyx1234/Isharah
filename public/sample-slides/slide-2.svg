<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#ffffff"/>
  <rect width="800" height="70" fill="#0F3D3E"/>
  <text x="400" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="white">مقارنة أداء الخوارزميات</text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Algorithm Performance Comparison</text>

  <!-- Chart area -->
  <rect x="80" y="90" width="640" height="300" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Y axis label -->
  <text x="30" y="240" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b" transform="rotate(-90, 30, 240)">الوقت / Time</text>

  <!-- X axis label -->
  <text x="400" y="410" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">حجم البيانات / Data Size (n)</text>

  <!-- Grid lines -->
  <line x1="120" y1="100" x2="120" y2="380" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="120" y1="380" x2="700" y2="380" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Bar chart: O(n²) -->
  <rect x="150" y="200" width="80" height="180" fill="#ef4444" rx="4" opacity="0.85"/>
  <text x="190" y="195" text-anchor="middle" font-family="Arial" font-size="11" fill="#ef4444" font-weight="bold">O(n²)</text>
  <text x="190" y="395" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Bubble</text>

  <!-- Bar chart: O(n log n) -->
  <rect x="280" y="280" width="80" height="100" fill="#f59e0b" rx="4" opacity="0.85"/>
  <text x="320" y="275" text-anchor="middle" font-family="Arial" font-size="11" fill="#f59e0b" font-weight="bold">O(n log n)</text>
  <text x="320" y="395" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Merge</text>

  <!-- Bar chart: O(n log n) Quick -->
  <rect x="410" y="295" width="80" height="85" fill="#10b981" rx="4" opacity="0.85"/>
  <text x="450" y="290" text-anchor="middle" font-family="Arial" font-size="11" fill="#10b981" font-weight="bold">O(n log n)*</text>
  <text x="450" y="395" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Quick</text>

  <!-- Bar chart: O(log n) -->
  <rect x="540" y="345" width="80" height="35" fill="#0F3D3E" rx="4" opacity="0.85"/>
  <text x="580" y="340" text-anchor="middle" font-family="Arial" font-size="11" fill="#0F3D3E" font-weight="bold">O(log n)</text>
  <text x="580" y="395" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Binary Search</text>

  <!-- Legend -->
  <rect x="80" y="420" width="640" height="60" rx="8" fill="#f1f5f9"/>
  <text x="400" y="445" text-anchor="middle" font-family="Arial" font-size="12" fill="#1e293b" font-weight="bold">أفضل خوارزمية للبيانات الكبيرة: الفرز السريع والبحث الثنائي</text>
  <text x="400" y="468" text-anchor="middle" font-family="Arial" font-size="11" fill="#64748b">Best for large data: Quick Sort and Binary Search</text>

  <rect x="0" y="490" width="800" height="10" fill="#0F3D3E"/>
</svg>
