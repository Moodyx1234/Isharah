<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#ffffff"/>
  <rect width="800" height="70" fill="#0F3D3E"/>
  <text x="400" y="45" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="white">كود الفرز الفقاعي - Python</text>
  <text x="400" y="65" text-anchor="middle" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.7)">Bubble Sort Code Example</text>

  <!-- Code block -->
  <rect x="40" y="85" width="720" height="290" rx="12" fill="#1e293b"/>

  <!-- Line numbers -->
  <text x="65" y="115" font-family="monospace" font-size="13" fill="#4a5568">1</text>
  <text x="65" y="140" font-family="monospace" font-size="13" fill="#4a5568">2</text>
  <text x="65" y="165" font-family="monospace" font-size="13" fill="#4a5568">3</text>
  <text x="65" y="190" font-family="monospace" font-size="13" fill="#4a5568">4</text>
  <text x="65" y="215" font-family="monospace" font-size="13" fill="#4a5568">5</text>
  <text x="65" y="240" font-family="monospace" font-size="13" fill="#4a5568">6</text>
  <text x="65" y="265" font-family="monospace" font-size="13" fill="#4a5568">7</text>
  <text x="65" y="290" font-family="monospace" font-size="13" fill="#4a5568">8</text>
  <text x="65" y="315" font-family="monospace" font-size="13" fill="#4a5568">9</text>
  <text x="65" y="340" font-family="monospace" font-size="13" fill="#4a5568">10</text>

  <!-- Code -->
  <text x="95" y="115" font-family="monospace" font-size="13" fill="#c678dd">def </text>
  <text x="125" y="115" font-family="monospace" font-size="13" fill="#61afef">bubble_sort</text>
  <text x="225" y="115" font-family="monospace" font-size="13" fill="#abb2bf">(arr):</text>

  <text x="95" y="140" font-family="monospace" font-size="13" fill="#98c379">    # احصل على طول القائمة</text>
  <text x="95" y="165" font-family="monospace" font-size="13" fill="#c678dd">    n </text>
  <text x="115" y="165" font-family="monospace" font-size="13" fill="#abb2bf">= </text>
  <text x="130" y="165" font-family="monospace" font-size="13" fill="#61afef">len</text>
  <text x="160" y="165" font-family="monospace" font-size="13" fill="#abb2bf">(arr)</text>

  <text x="95" y="190" font-family="monospace" font-size="13" fill="#c678dd">    for </text>
  <text x="130" y="190" font-family="monospace" font-size="13" fill="#abb2bf">i </text>
  <text x="142" y="190" font-family="monospace" font-size="13" fill="#c678dd">in </text>
  <text x="168" y="190" font-family="monospace" font-size="13" fill="#61afef">range</text>
  <text x="205" y="190" font-family="monospace" font-size="13" fill="#abb2bf">(n):</text>

  <text x="95" y="215" font-family="monospace" font-size="13" fill="#c678dd">        for </text>
  <text x="142" y="215" font-family="monospace" font-size="13" fill="#abb2bf">j </text>
  <text x="154" y="215" font-family="monospace" font-size="13" fill="#c678dd">in </text>
  <text x="180" y="215" font-family="monospace" font-size="13" fill="#61afef">range</text>
  <text x="217" y="215" font-family="monospace" font-size="13" fill="#abb2bf">(</text>
  <text x="223" y="215" font-family="monospace" font-size="13" fill="#d19a66">0</text>
  <text x="231" y="215" font-family="monospace" font-size="13" fill="#abb2bf">, n-i-</text>
  <text x="280" y="215" font-family="monospace" font-size="13" fill="#d19a66">1</text>
  <text x="288" y="215" font-family="monospace" font-size="13" fill="#abb2bf">):</text>

  <text x="95" y="240" font-family="monospace" font-size="13" fill="#98c379">            # قارن وبادل العناصر</text>

  <text x="95" y="265" font-family="monospace" font-size="13" fill="#c678dd">            if </text>
  <text x="135" y="265" font-family="monospace" font-size="13" fill="#abb2bf">arr[j] &gt; arr[j+</text>
  <text x="270" y="265" font-family="monospace" font-size="13" fill="#d19a66">1</text>
  <text x="278" y="265" font-family="monospace" font-size="13" fill="#abb2bf">]:</text>

  <text x="95" y="290" font-family="monospace" font-size="13" fill="#abb2bf">                arr[j], arr[j+</text>
  <text x="295" y="290" font-family="monospace" font-size="13" fill="#d19a66">1</text>
  <text x="303" y="290" font-family="monospace" font-size="13" fill="#abb2bf">] = arr[j+</text>
  <text x="388" y="290" font-family="monospace" font-size="13" fill="#d19a66">1</text>
  <text x="396" y="290" font-family="monospace" font-size="13" fill="#abb2bf">], arr[j]</text>

  <text x="95" y="315" font-family="monospace" font-size="13" fill="#c678dd">    return </text>
  <text x="150" y="315" font-family="monospace" font-size="13" fill="#abb2bf">arr</text>

  <!-- Example output -->
  <rect x="40" y="390" width="720" height="80" rx="8" fill="#0f3d3e" stroke="#e8985e" stroke-width="1.5"/>
  <text x="60" y="415" font-family="monospace" font-size="13" fill="#e8985e">>>> </text>
  <text x="90" y="415" font-family="monospace" font-size="13" fill="#f0f0f0">bubble_sort([64, 34, 25, 12, 22, 11, 90])</text>
  <text x="60" y="450" font-family="monospace" font-size="13" fill="#10b981">[11, 12, 22, 25, 34, 64, 90]  # ✓ مرتب</text>
</svg>
